<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — HealthSphere</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <header></header>

  <main class="main-content" style="display:flex;align-items:center;justify-content:center;padding:3rem 1rem;">
    <div style="width:100%;max-width:440px;">
      <div class="card" style="box-shadow:var(--shadow-xl);border-radius:var(--radius-lg);padding:2rem;">
        <div style="text-align:center;margin-bottom:1.75rem;">
          <div class="brand-icon" style="margin:0 auto 0.75rem;width:3rem;height:3rem;font-size:1.5rem;">⚕</div>
          <h2 style="font-size:1.6rem;margin-bottom:0.25rem;">Welcome to HealthSphere</h2>
          <p style="font-size:0.875rem;">Sign in to access your healthcare portal</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" required placeholder="name@example.com">
          </div>

          <div class="form-group">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.375rem;">
              <label class="form-label" for="login-password" style="margin:0;">Password</label>
            </div>
            <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.75rem;padding:0.75rem;" id="login-submit-btn">
            Sign In &rarr;
          </button>
        </form>

        <!-- Quick Demo Fill Buttons -->
        <div style="margin-top:1.75rem;padding-top:1.25rem;border-top:1px dashed var(--border-light);">
          <span style="font-size:0.75rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:0.5rem;text-align:center;">
            ⚡ Instant One-Click Demo Logins
          </span>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
            <button class="btn btn-sm btn-secondary demo-fill-btn" data-email="patient.alex@healthsphere.local" data-pass="DemoPassword123!" style="font-size:0.75rem;">
              👤 Patient (Alex)
            </button>
            <button class="btn btn-sm btn-secondary demo-fill-btn" data-email="dr.sarah@healthsphere.local" data-pass="DemoPassword123!" style="font-size:0.75rem;">
              🩺 Doctor (Sarah)
            </button>
            <button class="btn btn-sm btn-secondary demo-fill-btn" data-email="hospital@stjude.local" data-pass="DemoPassword123!" style="font-size:0.75rem;">
              🏥 Hospital (St. Jude)
            </button>
            <button class="btn btn-sm btn-secondary demo-fill-btn" data-email="admin@healthsphere.local" data-pass="DemoPassword123!" style="font-size:0.75rem;">
              👑 Administrator
            </button>
          </div>
        </div>

        <p style="text-align:center;font-size:0.875rem;margin-top:1.5rem;">
          Don't have an account? <a href="/register.html" style="font-weight:600;">Create an account</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module">
    import { api, setToken, showToast } from '/js/api.js';
    import { setupNavigation, getCurrentUser } from '/js/auth.js';

    setupNavigation('login');

    // If already logged in, redirect
    const existingUser = await getCurrentUser();
    if (existingUser) {
      redirectUser(existingUser.role);
    }

    // Demo fill buttons
    document.querySelectorAll('.demo-fill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('login-email').value = btn.getAttribute('data-email');
        document.getElementById('login-password').value = btn.getAttribute('data-pass');
        showToast('Demo credentials filled. Click "Sign In" or press Enter.', 'info', 2000);
      });
    });

    const form = document.getElementById('login-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('login-submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying credentials...';

      try {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        const res = await api.post('/auth/login', { email, password });
        if (res.success && res.data?.token) {
          setToken(res.data.token);
          showToast(`Welcome back, ${res.data.user.name}!`, 'success');
          setTimeout(() => {
            redirectUser(res.data.user.role);
          }, 400);
        }
      } catch (err) {
        showToast(err.message, 'danger');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In →';
      }
    });

    function redirectUser(role) {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      if (redirect) {
        window.location.href = redirect;
        return;
      }

      if (role === 'DOCTOR') window.location.href = '/doctor-dashboard.html';
      else if (role === 'ADMIN') window.location.href = '/admin-dashboard.html';
      else if (role === 'HOSPITAL') window.location.href = '/blood-network.html';
      else window.location.href = '/patient-dashboard.html';
    }
  </script>
</body>
</html>
